<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voronoi-Polygone konstruieren</title>
<style>
  :root {
    --bg: #fff;
    --ink: #263238;
    --muted: #66736a;
    --grid: #d8d0c2;
    --green: #1f6f5b;
    --accent: #e08d3c;
    --line: #334e68;
    --paper: #fff;
  }
  html, body {
    margin: 0;
    background: var(--bg);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 18px 18px 12px;
    box-sizing: border-box;
  }
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 8px;
  }
  h1 {
    margin: 0;
    font-size: clamp(24px, 4vw, 42px);
    line-height: 1.05;
    letter-spacing: -0.03em;
  }
  .sub {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: clamp(14px, 1.8vw, 18px);
  }
  .stage {
    position: relative;
    border: 1px solid #e2d8ca;
    background: var(--bg);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 26px rgba(38,50,56,.08);
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
  }
  .grid { stroke: var(--grid); stroke-width: .9; opacity: .45; }
  .frame { fill: none; stroke: var(--grid); stroke-width: 2; }
  .cell {
    opacity: 0;
    animation: cellIn 24s ease-in-out infinite;
  }
  .v-edge {
    stroke: var(--line);
    stroke-width: 3.2;
    stroke-linecap: round;
    opacity: 0;
    animation: edgeIn 24s ease-in-out infinite;
  }
  .bisector {
    stroke: var(--line);
    stroke-width: 1.8;
    stroke-dasharray: 9 8;
    opacity: 0;
    animation: bisectorIn 24s ease-in-out infinite;
  }
  .connect {
    stroke: var(--accent);
    stroke-width: 3.2;
    stroke-linecap: round;
    opacity: 0;
    animation: constructIn 24s ease-in-out infinite;
  }
  .highlight-bisector {
    stroke: var(--accent);
    stroke-width: 4;
    stroke-linecap: round;
    opacity: 0;
    animation: constructIn 24s ease-in-out infinite;
  }
  .midpoint {
    fill: var(--accent);
    stroke: white;
    stroke-width: 3;
    opacity: 0;
    animation: constructIn 24s ease-in-out infinite;
  }
  .point {
    fill: var(--green);
    stroke: white;
    stroke-width: 3;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.18));
    opacity: 0;
    animation: pointIn 24s ease-in-out infinite;
  }
  .point-label {
    font-weight: 750;
    font-size: 17px;
    fill: var(--ink);
    opacity: 0;
    animation: pointIn 24s ease-in-out infinite;
  }
  .captionbox {
    fill: var(--paper);
    stroke: #e3d4bd;
    stroke-width: 1.2;
  }
  .caption {
    fill: var(--ink);
    font-size: 21px;
    font-weight: 650;
  }
  .caption-small {
    fill: var(--muted);
    font-size: 15px;
  }
  .phase {
    opacity: 0;
    animation: phaseText 24s ease-in-out infinite;
  }
  .phase1 { animation-delay: 0s; }
  .phase2 { animation-delay: 0s; }
  .phase3 { animation-delay: 0s; }
  .phase4 { animation-delay: 0s; }

  @keyframes pointIn {
    0%, 4% { opacity: 0; transform: scale(.96); }
    8%, 100% { opacity: 1; transform: scale(1); }
  }
  @keyframes constructIn {
    0%, 18% { opacity: 0; }
    24%, 42% { opacity: 1; }
    48%, 100% { opacity: 0; }
  }
  @keyframes bisectorIn {
    0%, 26% { opacity: 0; }
    34%, 58% { opacity: .50; }
    70%, 100% { opacity: .14; }
  }
  @keyframes cellIn {
    0%, 47% { opacity: 0; }
    58%, 72% { opacity: .42; }
    82%, 100% { opacity: .82; }
  }
  @keyframes edgeIn {
    0%, 52% { opacity: 0; }
    64%, 100% { opacity: 1; }
  }

  .t1 { animation: t1 24s ease-in-out infinite; }
  .t2 { animation: t2 24s ease-in-out infinite; }
  .t3 { animation: t3 24s ease-in-out infinite; }
  .t4 { animation: t4 24s ease-in-out infinite; }
  @keyframes t1 { 0%, 20% {opacity:1} 26%,100% {opacity:0} }
  @keyframes t2 { 0%, 20% {opacity:0} 26%, 45% {opacity:1} 51%,100% {opacity:0} }
  @keyframes t3 { 0%, 49% {opacity:0} 56%, 73% {opacity:1} 80%,100% {opacity:0} }
  @keyframes t4 { 0%, 77% {opacity:0} 84%,100% {opacity:1} }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    color: var(--muted);
    font-size: 14px;
  }
  button {
    border: 1px solid #d5c8b8;
    border-radius: 999px;
    background: #fffaf0;
    color: var(--ink);
    font-weight: 700;
    padding: 8px 14px;
    cursor: pointer;
  }
  .paused * {
    animation-play-state: paused !important;
  }
</style>
</head>

    <g transform="translate(76 585)">

        <text class="caption" x="18" y="31">1. Punktdaten</text>

  </div>

  <div class="controls">
    <button id="toggle" type="button">Pause</button>
    <span>HTML/SVG-Animation: skalierbar & pausierbar.</span>
  </div>
</div>

<script>
  const stage = document.getElementById('stage');
  const btn = document.getElementById('toggle');
  btn.addEventListener('click', () => {
    stage.classList.toggle('paused');
    btn.textContent = stage.classList.contains('paused') ? 'Weiter' : 'Pause';
  });
</script>
</body>
</html>
